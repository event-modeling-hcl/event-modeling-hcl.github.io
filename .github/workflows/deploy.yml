name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout eventmodeling-hcl tool
        uses: actions/checkout@v4
        with:
          repository: event-modeling-hcl/eventmodeling-hcl
          path: tool

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tool/go.sum

      - name: Build eventmodeling-hcl
        working-directory: tool
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/eventmodeling-hcl" ./cmd/eventmodeling-hcl

      - name: Render example canvases
        env:
          TOOL_BIN: ${{ runner.temp }}/bin/eventmodeling-hcl
        run: scripts/build-examples.sh

      - name: Validate every Learn-page HCL snippet
        env:
          TOOL_BIN: ${{ runner.temp }}/bin/eventmodeling-hcl
        run: python3 scripts/validate-learn-snippets.py

      - name: Review site copy
        run: python3 scripts/check-copy.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
